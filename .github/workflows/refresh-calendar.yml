name: Refresh Sapporo calendar data

on:
  schedule:
    # Every Monday 03:00 JST (Sunday 18:00 UTC). Frequent enough to catch the
    # October fiscal-year resource_id rollover and any mid-year corrections
    # without hammering the CKAN API.
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm run fetch:sapporo

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/sapporo/calendar.json data/sapporo/source.json; then
            echo "No data changes."
            exit 0
          fi
          git add data/sapporo/calendar.json data/sapporo/source.json
          git commit -m "chore: refresh Sapporo calendar data"
          git push
